# RoadMate – hạ tầng dev: PostgreSQL + ELK (Elasticsearch + Kibana). API chạy bằng `dotnet run` trên máy,
# hoặc `docker compose --profile api up -d --build` để chạy cả API trong Docker.
#   cd deploy && cp .env.example .env && docker compose up -d
# Linux: Elasticsearch cần `sudo sysctl -w vm.max_map_count=262144`.
name: roadmate

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: roadmate
      POSTGRES_USER: roadmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roadmate_dev}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadmate -d roadmate"]
      interval: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"        # CHỈ cho dev. Production: bật security và đặt Observability__Elasticsearch__Username/Password
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 10s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["5601:5601"]
    depends_on:
      elasticsearch: { condition: service_healthy }

  # Chạy một lần: tạo sẵn data view "roadmate-logs-*" trong Kibana (Discover xem log ngay).
  kibana-setup:
    image: curlimages/curl:8.10.1
    depends_on: [kibana]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -s http://kibana:5601/api/status | grep -q '"level":"available"'; do sleep 5; done
        curl -s -X POST http://kibana:5601/api/data_views/data_view -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
          -d '{"data_view":{"id":"roadmate-logs","title":"roadmate-logs-*","name":"RoadMate logs","timeFieldName":"@timestamp"},"override":true}'

  api:
    profiles: ["api"]
    build: { context: .., dockerfile: deploy/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=roadmate;Username=roadmate;Password=${POSTGRES_PASSWORD:-roadmate_dev}
      Database__EnsureCreated: "true"
      Firebase__CredentialPath: /run/secrets/firebase-adminsdk.json
      Observability__Elasticsearch__Enabled: "true"
      Observability__Elasticsearch__Uri: http://elasticsearch:9200
      Goong__ApiKey: ${GOONG_API_KEY:-}
      Sms__Provider: ${SMS_PROVIDER:-log}
      Sms__ESms__ApiKey: ${ESMS_API_KEY:-}
      Sms__ESms__SecretKey: ${ESMS_SECRET_KEY:-}
    volumes:
      - ../secrets/firebase-adminsdk.json:/run/secrets/firebase-adminsdk.json:ro
    ports: ["8080:8080"]

volumes:
  pgdata:
  esdata:
